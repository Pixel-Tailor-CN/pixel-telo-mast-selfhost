server:
  listen: ":8443"
auth:
  token_file: "/data/token"
tls:
  mode: "auto"
  public_url: "https://203.0.113.10:8443"
  cert_file: ""
  key_file: ""
  allow_insecure_private_network: false
storage:
  runtime_path: "/data/runtime.db"
baseline:
  enabled: true
  sync_on_start: true
  check_interval: "24h"
query:
  timeout: "2s"
  max_concurrent: 4
rate_limit:
  requests_per_second: 1
  burst: 5
upstream:
  provider_ids:
    - "sogou"
log:
  level: "info"
  format: "json"
