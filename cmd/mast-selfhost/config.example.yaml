server:
  listen: {{.Listen}}
auth:
  token_file: {{.TokenPath}}
tls:
  mode: "off"
  public_url: ""
  cert_file: ""
  key_file: ""
  allow_insecure_private_network: {{.AllowInsecurePrivateNetwork}}
storage:
  runtime_path: {{.RuntimePath}}
baseline:
  enabled: false
  sync_on_start: false
  check_interval: "24h"
query:
  timeout: "2s"
  max_concurrent: 4
rate_limit:
  requests_per_second: 1
  burst: 5
upstream:
  provider_ids:
    - "sogou"
providers: {}
log:
  level: "info"
  format: "json"
