server:
  listen: {{.Listen}}
auth:
  token_file: {{.TokenPath}}
tls:
  mode: {{.TLSMode}}
  public_url: {{.PublicURL}}
  cert_file: ""
  key_file: ""
  allow_insecure_private_network: {{.AllowInsecurePrivateNetwork}}
storage:
  runtime_path: {{.RuntimePath}}
baseline:
  enabled: true
  sync_on_start: {{.SyncOnStart}}
  check_interval: "24h"
query:
  timeout: "2s"
  max_concurrent: 4
rate_limit:
  requests_per_second: 1
  burst: 5
upstream:
  # 当前已支持的 Provider ID：sogou、360
  # 必须显式填写已获部署者授权使用的项，列表顺序即默认查询优先级。
  # 示例：provider_ids: ["sogou", "360"]
  # 也可在 init 时重复传入 --provider-id sogou --provider-id 360
  provider_ids: {{.ProviderIDs}}
# 可按上面的 ID 覆盖调度参数；未配置时使用默认并发 1、间隔 0、熔断 30s。
# sogou:
#   min_interval: "1s"
#   max_concurrent: 1
#   breaker_timeout: "30s"
# "360":
#   min_interval: "1s"
#   max_concurrent: 1
#   breaker_timeout: "30s"
providers: {}
log:
  level: "info"
  format: "json"
  rotation:
    max_size_mb: 100
    daily: true
    local_time: true
    compress: true
  retention:
    max_age: "720h"
    max_backups: 30
    max_total_size_mb: 1024
