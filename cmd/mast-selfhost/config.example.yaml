server:
  listen: {{.Listen}}
auth:
  token_file: {{.TokenPath}}
tls:
  mode: "off"
  public_url: ""
  cert_file: ""
  key_file: ""
  allow_insecure_private_network: {{.AllowInsecurePrivateNetwork}}
storage:
  runtime_path: {{.RuntimePath}}
baseline:
  enabled: true
  sync_on_start: {{.SyncOnStart}}
  check_interval: "24h"
query:
  timeout: "2s"
  max_concurrent: 4
rate_limit:
  requests_per_second: 1
  burst: 5
upstream:
  # 必须显式填写已获部署者授权使用的 Provider，例如：
  # 通过 init --provider-id 显式选择已获授权的 Provider。
  provider_ids: {{.ProviderIDs}}
providers: {}
log:
  level: "info"
  format: "json"
