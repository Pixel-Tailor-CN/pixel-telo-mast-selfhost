name: CI
on:
  push:
  pull_request:
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan repository for secrets
        run: docker run --rm -v "${{ github.workspace }}:/repo:ro" zricethezav/gitleaks:v8.30.1 detect --source=/repo --redact --no-banner
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
      - name: Scan Go dependencies
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Check licenses
        run: |
          go install github.com/google/go-licenses@latest
          go-licenses check --confidence_threshold=0.8 ./...
      - name: Verify embedded phone data
        working-directory: phone
        run: sha256sum -c phone.dat.sha256

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mast_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
      - name: Test Vercel build version resolution
        run: bash scripts/vercel-build_test.sh
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
        env:
          MAST_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/mast_test?sslmode=disable
      - run: go build ./cmd/...
