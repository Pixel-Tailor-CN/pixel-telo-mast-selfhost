name: CI
on:
  push:
  pull_request:
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan repository for secrets
        run: docker run --rm -v "${{ github.workspace }}:/repo:ro" zricethezav/gitleaks:v8.30.1 detect --source=/repo --redact --no-banner
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - name: Scan Go dependencies
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Check licenses
        run: |
          go install github.com/google/go-licenses@latest
          go-licenses check ./...
      - name: Verify embedded phone data
        run: sha256sum -c phone/phone.dat.sha256

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/...
