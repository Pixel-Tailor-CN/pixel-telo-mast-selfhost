name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

env:
  GHCR_IMAGE: ghcr.io/pixel-tailor-cn/pixel-telo-mast-selfhost
  DOCKERHUB_IMAGE: mystery0/pixel-telo-mast-selfhost

jobs:
  verify:
    name: Verify release inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag format
        run: |
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - name: Verify embedded phone data
        working-directory: phone
        run: sha256sum -c phone.dat.sha256
      - name: Scan repository for secrets
        run: docker run --rm -v "${{ github.workspace }}:/repo:ro" zricethezav/gitleaks:v8.30.1 detect --source=/repo --redact --no-banner
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - name: Scan dependencies and licenses
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
          go install github.com/google/go-licenses@latest
          go-licenses check --confidence_threshold=0.8 ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ''
          - goos: linux
            goarch: arm64
            ext: ''
          - goos: windows
            goarch: amd64
            ext: '.exe'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v} -X main.commit=${GITHUB_SHA}" \
            -o "dist/mast-selfhost-${GOOS}-${GOARCH}${{ matrix.ext }}" ./cmd/mast-selfhost
      - uses: actions/upload-artifact@v4
        with:
          name: mast-selfhost-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/mast-selfhost-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          if-no-files-found: error

  package:
    name: Package and attest release
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mast-selfhost-*
          merge-multiple: true
          path: dist
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: dist
          format: spdx-json
          output-file: dist/sbom.spdx.json
          upload-artifact: false
      - name: Generate checksums
        working-directory: dist
        run: sha256sum mast-selfhost-* sbom.spdx.json > checksums.txt
      - uses: sigstore/cosign-installer@v3
      - name: Sign checksums
        run: cosign sign-blob --yes --bundle dist/checksums.txt.bundle dist/checksums.txt
      - name: Attest release materials
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/checksums.txt
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  docker-build:
    name: Build image ${{ matrix.platform }}
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            artifact: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build and push platform image
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,"name=${{ env.GHCR_IMAGE }},${{ env.DOCKERHUB_IMAGE }}",push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
      - name: Export image digest
        env:
          DIGEST: ${{ steps.build-image.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.artifact }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-publish:
    name: Publish multi-architecture image
    needs: docker-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: image-digest-*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Create multi-architecture manifests
        run: |
          mapfile -t digest_files < <(find /tmp/digests -maxdepth 1 -type f -print | sort)
          test "${#digest_files[@]}" -eq 2

          for image in "${GHCR_IMAGE}" "${DOCKERHUB_IMAGE}"; do
            references=()
            for digest_file in "${digest_files[@]}"; do
              references+=("${image}@sha256:${digest_file##*/}")
            done
            docker buildx imagetools create \
              --tag "${image}:${GITHUB_REF_NAME}" \
              --tag "${image}:latest" \
              "${references[@]}"
          done
      - name: Verify registry digests
        id: registry-digests
        run: |
          ghcr_digest=$(docker buildx imagetools inspect \
            "${GHCR_IMAGE}:${GITHUB_REF_NAME}" \
            --format '{{json .Manifest}}' | jq -r '.digest')
          dockerhub_digest=$(docker buildx imagetools inspect \
            "${DOCKERHUB_IMAGE}:${GITHUB_REF_NAME}" \
            --format '{{json .Manifest}}' | jq -r '.digest')
          ghcr_latest_digest=$(docker buildx imagetools inspect \
            "${GHCR_IMAGE}:latest" \
            --format '{{json .Manifest}}' | jq -r '.digest')
          dockerhub_latest_digest=$(docker buildx imagetools inspect \
            "${DOCKERHUB_IMAGE}:latest" \
            --format '{{json .Manifest}}' | jq -r '.digest')

          test -n "${ghcr_digest}" && test "${ghcr_digest}" != "null"
          test -n "${dockerhub_digest}" && test "${dockerhub_digest}" != "null"
          test -n "${ghcr_latest_digest}" && test "${ghcr_latest_digest}" != "null"
          test -n "${dockerhub_latest_digest}" && test "${dockerhub_latest_digest}" != "null"
          test "${ghcr_digest}" = "${dockerhub_digest}"
          test "${ghcr_digest}" = "${ghcr_latest_digest}"
          test "${ghcr_digest}" = "${dockerhub_latest_digest}"

          echo "ghcr=${ghcr_digest}" >> "${GITHUB_OUTPUT}"
          echo "dockerhub=${dockerhub_digest}" >> "${GITHUB_OUTPUT}"
      - name: Verify image version and health endpoint
        env:
          IMAGE: ${{ env.GHCR_IMAGE }}:${{ github.ref_name }}
        run: |
          test "${IMAGE##*:}" = "${GITHUB_REF_NAME}"
          docker volume create mast-selfhost-smoke-data
          docker run --rm -v mast-selfhost-smoke-data:/app/data "$IMAGE" init --dir /app/data --listen 0.0.0.0:8443 --allow-insecure-private-network --provider-id sogou --sync-on-start=false
          docker run -d --name mast-selfhost-smoke -v mast-selfhost-smoke-data:/app/data -p 18443:8443 "$IMAGE" serve --dir /app/data
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18443/api/health; then exit 0; fi
            sleep 1
          done
          docker logs mast-selfhost-smoke
          exit 1
      - uses: sigstore/cosign-installer@v3
      - name: Sign images
        env:
          GHCR_DIGEST: ${{ steps.registry-digests.outputs.ghcr }}
          DOCKERHUB_DIGEST: ${{ steps.registry-digests.outputs.dockerhub }}
        run: |
          cosign sign --yes "${GHCR_IMAGE}@${GHCR_DIGEST}"
          cosign sign --yes "${DOCKERHUB_IMAGE}@${DOCKERHUB_DIGEST}"
