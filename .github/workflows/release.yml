name: Release
on:
  push:
    tags: ['v*.*.*']
jobs:
  release:
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
      - run: go build -trimpath -ldflags "-X main.version=${GITHUB_REF_NAME#v} -X main.commit=${GITHUB_SHA}" -o mast-selfhost ./cmd/mast-selfhost
      - uses: softprops/action-gh-release@v2
        with:
          files: mast-selfhost
