name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  verify:
    name: Verify release inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag format
        run: [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - name: Verify embedded phone data
        run: sha256sum -c phone/phone.dat.sha256
      - name: Scan repository for secrets
        run: docker run --rm -v "${{ github.workspace }}:/repo:ro" zricethezav/gitleaks:v8.30.1 detect --source=/repo --redact --no-banner
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - name: Scan dependencies and licenses
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
          go install github.com/google/go-licenses@latest
          go-licenses check ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ''
          - goos: linux
            goarch: arm64
            ext: ''
          - goos: windows
            goarch: amd64
            ext: '.exe'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v} -X main.commit=${GITHUB_SHA}" \
            -o "dist/mast-selfhost-${GOOS}-${GOARCH}${{ matrix.ext }}" ./cmd/mast-selfhost
      - uses: actions/upload-artifact@v4
        with:
          name: mast-selfhost-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/mast-selfhost-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          if-no-files-found: error

  package:
    name: Package and attest release
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mast-selfhost-*
          merge-multiple: true
          path: dist
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: dist
          format: spdx-json
          output-file: dist/sbom.spdx.json
          upload-artifact: false
      - name: Generate checksums
        working-directory: dist
        run: sha256sum mast-selfhost-* sbom.spdx.json > checksums.txt
      - uses: sigstore/cosign-installer@v3
      - name: Sign checksums
        run: cosign sign-blob --yes --bundle dist/checksums.txt.bundle dist/checksums.txt
      - name: Attest release materials
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/checksums.txt
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  docker:
    name: Publish multi-architecture image
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
      - name: Build and push image
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Verify image version and health endpoint
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
        run: |
          test "${IMAGE##*:}" = "${GITHUB_REF_NAME}"
          docker volume create mast-selfhost-smoke-data
          docker run --rm -v mast-selfhost-smoke-data:/app/data "$IMAGE" init --dir /app/data --listen 0.0.0.0:8443 --allow-insecure-private-network --provider-id sogou --sync-on-start=false
          docker run -d --name mast-selfhost-smoke -v mast-selfhost-smoke-data:/app/data -p 18443:8443 "$IMAGE" serve --dir /app/data
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18443/api/health; then exit 0; fi
            sleep 1
          done
          docker logs mast-selfhost-smoke
          exit 1
      - uses: sigstore/cosign-installer@v3
      - name: Sign image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.build-image.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
